<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI House Design Tool — Test</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
  textarea { width: 100%; height: 100px; padding: 10px; font-size: 14px; }
  button { padding: 10px 20px; font-size: 15px; margin-top: 10px; cursor: pointer; }
  #result { margin-top: 30px; }
  .floor { margin-bottom: 30px; }
  svg { max-width: 100%; border: 1px solid #ddd; }
  .warn { color: #b45; font-size: 13px; }
</style>
</head>
<body>
  <h2>AI House Design Tool</h2>
  <p>Describe the house you want (plot size, rooms, floors, any preferences):</p>
  <textarea id="brief">3BHK independent house, 30ft x 40ft plot, north-facing entrance, kitchen in south-east corner.</textarea>
  <br>
  <button onclick="generate()">Generate Plan</button>
  <div id="result"></div>

  <script>
    // Point this at your deployed API URL
    const API_URL = "https://plan-verse-xi.vercel.app/generate";

    async function generate() {
      const brief = document.getElementById("brief").value;
      document.getElementById("result").innerHTML = "Generating...";
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ brief, generate_images: false }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Request failed");

        let html = "";
        for (const [floorNum, floor] of Object.entries(data.floors)) {
          html += `<div class="floor"><h3>Floor ${floorNum}</h3>${floor.plan_svg}`;
          if (floor.warnings.length) {
            html += `<div class="warn">Warnings: ${floor.warnings.join(", ")}</div>`;
          }
          html += `</div>`;
        }
        html += `<div class="floor"><h3>Elevation</h3>${data.elevation_svg}</div>`;
        html += `<div class="floor"><h3>Section</h3>${data.section_svg}</div>`;
        document.getElementById("result").innerHTML = html;
      } catch (e) {
        document.getElementById("result").innerHTML = `<p style="color:red">${e.message}</p>`;
      }
    }
  </script>
</body>
</html>
